<!-- @dsCard group="Actions" height=640 subtitle="Switcher with the list open, and the three banner modes" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LanguageSwitcher — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap">
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-text); }
#root { display: flex; flex-direction: column; gap: 16px; padding: 12px; }
.bar { display: flex; justify-content: flex-end; padding: 14px 24px 150px; background: var(--panel); border-radius: 16px; }
.mom-language-banner { border-radius: 16px; }
:root:lang(zh-Hans) { --font-text: Archivo, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var M = window.MoM, h = React.createElement;
  var alternates = [
    { tag: 'en', name: 'English', url: '#en' },
    { tag: 'es-419', name: 'Español', url: '#es' },
    { tag: 'zh-Hans', name: '中文', url: '#zh' }
  ];
  var zh = { noticed: '我们注意到您偏好中文。', countdown: '{seconds} 秒后切换到中文版…', switchNow: '立即切换', stay: '留在此页', pause: '暂停',
             switched: '已切换到中文', undo: '撤销', dismiss: '关闭' };
  var en = { readInThisLanguage: 'Read in English', dismiss: 'Close' };
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'bar' }, h(M.LanguageSwitcher, { alternates: alternates, current: 'es-419', label: 'Idioma', open: true })),
    h(M.LanguageBanner, { mode: 'offer', lang: 'zh-Hans', strings: zh, seconds: 11 }),
    h(M.LanguageBanner, { mode: 'read', lang: 'en', strings: en }),
    h(M.LanguageBanner, { mode: 'note', lang: 'zh-Hans', strings: zh })
  ));
</script>
</body>
</html>
