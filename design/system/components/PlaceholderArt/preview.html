<!-- @dsCard group="Content" height=560 subtitle="Six compositions, three tones; papers get pages" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PlaceholderArt — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap">
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-text); }
#root { padding: 24px; display: grid; grid-template-columns: repeat(3, 240px); gap: 16px 20px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figcaption { font: 600 13px/1.3 var(--font-text); color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var M = window.MoM, h = React.createElement;
  var samples = [
    { composition: 'sun-slab', tone: 'brand' },
    { composition: 'rising', tone: 'machine' },
    { composition: 'eclipse', tone: 'human' },
    { composition: 'moon', tone: 'machine' },
    { composition: 'horizon', tone: 'brand' },
    { composition: 'pages', tone: 'human', kind: 'paper' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    samples.map(function (sample) {
      return h('figure', { key: sample.composition },
        h(M.PlaceholderArt, { composition: sample.composition, tone: sample.tone, kind: sample.kind, className: 'mom-ratio-wide' }),
        h('figcaption', null, sample.composition + ' · ' + sample.tone + (sample.kind ? ' · papers' : '')));
    })
  ));
</script>
</body>
</html>
