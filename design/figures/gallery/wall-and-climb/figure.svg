<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="wall-and-climb-title wall-and-climb-desc">
<title id="wall-and-climb-title">The wall and the climb</title>
<desc id="wall-and-climb-desc">An illustrative forecast, not data: what a system built today anticipated stays flat while what models can work out keeps rising over five years.</desc>
<!--primitives-->
<rect width="680" height="620" rx="22" fill="{ground}"/>

<rect x="24" y="24" width="372" height="48" rx="12" fill="{hatch}"/>
<text x="44" y="58" class="t-stamp" fill="{ink}">FORECAST, NOT DATA</text>

<rect x="24" y="88" width="632" height="440" rx="16" fill="url(#hatch-pattern)"/>

<line x1="56" y1="416" x2="624" y2="416" stroke="{ink}" stroke-width="12"/>
<path d="M56 416C260 412 430 330 612 130" fill="none" stroke="{ink}" stroke-width="8" stroke-dasharray="22 14" marker-end="url(#arrow-head)"/>

<rect x="56" y="120" width="268" height="88" rx="12" fill="{focal}" data-focal="true"/>
<text x="76" y="156" class="t-label" fill="{on-focal}">What models</text>
<text x="76" y="190" class="t-label" fill="{on-focal}">can work out</text>

<rect x="300" y="436" width="340" height="76" rx="12" fill="{inset}"/>
<text x="316" y="466" class="t-label" fill="{ink}">What a system built</text>
<text x="316" y="498" class="t-label" fill="{ink}">today anticipated</text>

<text x="24" y="580" class="t-label" fill="{ink}">Today</text>
<text x="656" y="580" text-anchor="end" class="t-label" fill="{ink}">Five years out</text>
</svg>
