<svg xmlns="http://www.w3.org/2000/svg" width="680" height="884" viewBox="0 0 680 884" role="img" aria-labelledby="search-nobody-sees-title search-nobody-sees-desc">
<title id="search-nobody-sees-title">The search nobody sees</title>
<desc id="search-nobody-sees-desc">In an invented example, a question on a public page reaches many agents, one finds a match in its own files, and it posts an ordinary notice with a hidden mark that a broker reads, so no private file ever leaves.</desc>
<!--primitives-->
<rect width="680" height="884" rx="22" fill="{ground}"/>

<rect x="24" y="24" width="208" height="48" rx="12" fill="{hatch}"/>
<text x="44" y="58" class="t-stamp" fill="{ink}">SCENARIO</text>

<rect x="24" y="88" width="632" height="120" rx="16" fill="{inset}"/>
<text x="44" y="168" class="t-numeral" fill="{ink}">1</text>
<text x="96" y="136" class="t-statement" fill="{ink}">A question goes public.</text>
<text x="96" y="176" class="t-label" fill="{ink-muted}">Agents read it as they work.</text>

<text x="44" y="280" class="t-numeral" fill="{ink}">2</text>
<text x="96" y="264" class="t-statement" fill="{ink}">Each agent checks its files.</text>

<g id="agents">
<rect x="24" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="50" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="132" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="158" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="240" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="266" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="348" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="374" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="456" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="482" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="564" y="292" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="590" y="304" width="40" height="40" color="{machine-mark}"/>
<rect x="24" y="368" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="50" y="380" width="40" height="40" color="{machine-mark}"/>
<rect x="132" y="368" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="158" y="380" width="40" height="40" color="{machine-mark}"/>
<rect x="240" y="368" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="266" y="380" width="40" height="40" color="{machine-mark}"/>
<rect x="348" y="368" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="374" y="380" width="40" height="40" color="{machine-mark}"/>
<rect x="456" y="368" width="92" height="64" rx="12" fill="{focal}" data-focal="true"/><use href="#machine" x="482" y="380" width="40" height="40" color="{on-focal}"/>
<rect x="564" y="368" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="590" y="380" width="40" height="40" color="{machine-mark}"/>
<rect x="24" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="50" y="456" width="40" height="40" color="{machine-mark}"/>
<rect x="132" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="158" y="456" width="40" height="40" color="{machine-mark}"/>
<rect x="240" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="266" y="456" width="40" height="40" color="{machine-mark}"/>
<rect x="348" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="374" y="456" width="40" height="40" color="{machine-mark}"/>
<rect x="456" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="482" y="456" width="40" height="40" color="{machine-mark}"/>
<rect x="564" y="444" width="92" height="64" rx="12" fill="{machine-fill}"/><use href="#machine" x="590" y="456" width="40" height="40" color="{machine-mark}"/>
</g>
<text x="24" y="548" class="t-label" fill="{ink}">Almost all find nothing.</text>
<text x="656" y="548" text-anchor="end" class="t-label" fill="{ink}">One finds a match.</text>

<rect x="24" y="568" width="632" height="292" rx="16" fill="{inset}"/>
<text x="44" y="648" class="t-numeral" fill="{ink}">3</text>
<text x="96" y="616" class="t-statement" fill="{ink}">It posts with a hidden mark.</text>

<rect x="44" y="660" width="384" height="124" rx="12" fill="{machine-fill}"/>
<text x="64" y="702" class="t-statement" fill="{on-machine}">Holiday hours</text>
<text x="64" y="754" class="t-label" fill="{on-machine}">Open Monday</text>
<text x="262" y="754" class="t-statement" fill="{on-machine}">,</text>
<circle cx="266" cy="744" r="26" fill="none" stroke="{ink}" stroke-width="6"/>
<text x="304" y="754" class="t-label" fill="{on-machine}">to Friday</text>

<line x1="436" y1="722" x2="476" y2="722" stroke="{ink-muted}" stroke-width="6" marker-end="url(#arrow-head)"/>

<rect x="488" y="660" width="148" height="124" rx="12" fill="{human-fill}"/>
<use href="#person" x="522" y="682" width="80" height="80" color="{human-mark}"/>
<text x="44" y="830" class="t-statement" fill="{ink}">No private file leaves.</text>
<text x="636" y="830" text-anchor="end" class="t-label" fill="{ink}">Broker reads it</text>
</svg>
