<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="reach-through-the-wall-title reach-through-the-wall-desc">
<title id="reach-through-the-wall-title">Reaching through the wall</title>
<desc id="reach-through-the-wall-desc">A robot locked in a cell, at a desk piled with private files, passes an envelope out through a slot in the wall.</desc>
<!--primitives-->
<rect width="960" height="540" fill="{inset}"/>

<g id="outside">
<rect x="690" y="0" width="270" height="540" fill="{ground}"/>
<circle cx="960" cy="90" r="150" fill="{machine-fill}"/>
</g>
<rect x="0" y="470" width="960" height="70" fill="{machine-fill}"/>

<g id="cell-door">
<rect x="36" y="110" width="170" height="360" rx="12" fill="{structure}"/>
<rect x="66" y="146" width="110" height="84" rx="10" fill="{inset}"/>
<rect x="84" y="146" width="12" height="84" fill="{structure}"/>
<rect x="115" y="146" width="12" height="84" fill="{structure}"/>
<rect x="146" y="146" width="12" height="84" fill="{structure}"/>
<circle cx="176" cy="320" r="13" fill="{inset}"/>
</g>

<g id="wall">
<rect x="640" y="0" width="60" height="264" fill="{structure}"/>
<rect x="640" y="336" width="60" height="204" fill="{structure}"/>
</g>

<g id="desk">
<rect x="244" y="346" width="340" height="24" rx="8" fill="{structure}"/>
<rect x="266" y="370" width="22" height="100" fill="{structure}"/>
</g>

<g id="files">
<rect x="262" y="318" width="124" height="28" rx="6" fill="{human-mark}"/>
<rect x="270" y="290" width="104" height="24" rx="6" fill="{structure}"/>
<rect x="258" y="258" width="118" height="28" rx="6" fill="{human-mark}"/>
<rect x="272" y="230" width="96" height="24" rx="6" fill="{structure}"/>
</g>

<g id="agent" data-focal="true">
<rect x="456" y="274" width="112" height="196" rx="24" fill="{ink}"/>
<rect x="501" y="116" width="14" height="44" rx="7" fill="{ink}"/>
<circle cx="508" cy="110" r="16" fill="{ink}"/>
<rect x="442" y="150" width="132" height="112" rx="26" fill="{ink}"/>
<circle cx="540" cy="204" r="15" fill="{on-focal}"/>
<circle cx="492" cy="204" r="15" fill="{on-focal}"/>
<rect x="550" y="290" width="186" height="20" rx="10" fill="{ink}"/>
<rect x="384" y="316" width="84" height="20" rx="10" fill="{ink}"/>
<rect x="724" y="244" width="176" height="112" rx="12" fill="{ink}"/>
<path d="M736 258l76 56 76-56" fill="none" stroke="{on-focal}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
