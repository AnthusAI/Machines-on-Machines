<svg xmlns="http://www.w3.org/2000/svg" width="680" height="656" viewBox="0 0 680 656" role="img" aria-labelledby="cant-opt-out-title cant-opt-out-desc">
<title id="cant-opt-out-title">You can't opt out</title>
<desc id="cant-opt-out-desc">A person with no agent, and four other people's agents that have read about them.</desc>
<!--primitives-->
<rect width="680" height="656" rx="22" fill="{ground}"/>
<line x1="64" y1="136" x2="64" y2="567" stroke="{ink-muted}" stroke-width="6"/>
<line x1="64" y1="252" x2="96" y2="252" stroke="{ink-muted}" stroke-width="6"/>
<line x1="64" y1="356" x2="96" y2="356" stroke="{ink-muted}" stroke-width="6"/>
<line x1="64" y1="460" x2="96" y2="460" stroke="{ink-muted}" stroke-width="6"/>
<line x1="64" y1="564" x2="96" y2="564" stroke="{ink-muted}" stroke-width="6"/>
<rect x="24" y="24" width="632" height="112" rx="12" fill="{focal}" data-focal="true"/>
<use href="#person" x="44" y="60" width="40" height="40" color="{on-focal}"/>
<text x="104" y="72" class="t-statement" fill="{on-focal}">You</text>
<text x="104" y="108" class="t-label" fill="{on-focal}">You never used an agent.</text>
<text x="96" y="184" class="t-label" fill="{ink}">These have read about you.</text>
<rect x="96" y="208" width="560" height="88" rx="12" fill="{machine-fill}"/>
<use href="#machine" x="116" y="232" width="40" height="40" color="{machine-mark}"/>
<text x="176" y="262" class="t-statement" fill="{on-machine}">Your doctor's agent</text>
<rect x="96" y="312" width="560" height="88" rx="12" fill="{machine-fill}"/>
<use href="#machine" x="116" y="336" width="40" height="40" color="{machine-mark}"/>
<text x="176" y="366" class="t-statement" fill="{on-machine}">Your employer's agent</text>
<rect x="96" y="416" width="560" height="88" rx="12" fill="{machine-fill}"/>
<use href="#machine" x="116" y="440" width="40" height="40" color="{machine-mark}"/>
<text x="176" y="470" class="t-statement" fill="{on-machine}">Your lawyer's agent</text>
<rect x="96" y="520" width="560" height="88" rx="12" fill="{machine-fill}"/>
<use href="#machine" x="116" y="544" width="40" height="40" color="{machine-mark}"/>
<text x="176" y="574" class="t-statement" fill="{on-machine}">Your sister's agent</text>
</svg>
