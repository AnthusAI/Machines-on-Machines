<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="parked-car-title parked-car-desc">
<title id="parked-car-title">The parked car</title>
<desc id="parked-car-desc">An invented scene: a car parked on a quiet street across from a small clinic, with someone sitting inside it.</desc>
<!--primitives-->
<rect width="960" height="540" fill="{ground}"/>
<circle cx="828" cy="52" r="172" fill="{human-fill}"/>

<rect x="0" y="304" width="960" height="52" fill="{inset}"/>
<rect x="0" y="356" width="960" height="184" fill="{machine-fill}"/>

<g id="clinic">
<rect x="128" y="120" width="432" height="208" rx="16" fill="{brand}"/>
<rect x="168" y="64" width="208" height="80" rx="16" fill="{machine-fill}"/>
<text x="272" y="122" text-anchor="middle" class="t-head" fill="{on-machine}">CLINIC</text>
<rect x="184" y="184" width="80" height="80" rx="12" fill="{machine-fill}"/>
<rect x="304" y="184" width="80" height="80" rx="12" fill="{machine-fill}"/>
<rect x="436" y="184" width="84" height="144" rx="12" fill="{human-fill}"/>
<circle cx="500" cy="264" r="8" fill="{ink}"/>
</g>

<g id="car" data-focal="true">
<circle cx="596" cy="464" r="40" fill="{ink}"/>
<circle cx="820" cy="464" r="40" fill="{ink}"/>
<rect x="496" y="400" width="432" height="72" rx="28" fill="{ink}"/>
<path d="M568 408C580 352 608 332 656 332H748C792 332 816 356 848 408z" fill="{ink}"/>
<path d="M612 400C620 370 632 356 660 356H696V400z" fill="{on-focal}"/>
<path d="M720 356H748C772 356 788 370 808 400H720z" fill="{on-focal}"/>
<circle cx="678" cy="376" r="10" fill="{ink}"/>
<rect x="662" y="388" width="32" height="14" rx="6" fill="{ink}"/>
</g>

<rect x="24" y="456" width="444" height="60" rx="12" fill="{inset}"/>
<text x="44" y="499" class="t-stamp" fill="{ink}">INVENTED SCENE</text>
</svg>
